name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs-and-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema pyyaml yamllint
      - run: ./scripts/validation/validate-json-schema.py
      - run: yamllint .
      - run: python semantic-search/evaluation/check_openapi.py

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Test against the locked runtime versions the image ships, then add dev tools.
      - run: pip install --require-hashes -r semantic-search/indexer/requirements.txt
      - run: pip install -e semantic-search/indexer[dev] && pip check
      - run: python -m ruff check semantic-search/indexer/src semantic-search/indexer/tests scripts
      - run: python -m mypy semantic-search/indexer/src
      # The OpenSearch integration tests skip without Docker locally; in CI that must fail.
      - run: pytest -rs semantic-search/indexer/tests
        env:
          REQUIRE_DOCKER_TESTS: '1'

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -q -f semantic-search/query-api/pom.xml test
      # The isolation test skips itself without Docker; in CI a skip must fail the job.
      - name: Require tenant isolation test to run against OpenSearch
        run: |
          report=semantic-search/query-api/target/surefire-reports/TEST-com.example.observability.search.api.TenantIsolationIntegrationTest.xml
          if ! grep -q 'skipped="0"' "$report"; then
            echo "::error::TenantIsolationIntegrationTest did not run; check the Docker/Testcontainers setup"
            exit 1
          fi

  shell-and-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans every commit in the pull request, not only the tip.
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: find scripts -name '*.sh' -print0 | xargs -0 -r shellcheck
      - uses: zricethezav/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform-and-kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform/environments/lab init -backend=false -input=false
      - run: terraform -chdir=terraform/environments/lab validate
      - uses: azure/setup-kubectl@v4
      - run: docker run --rm -v "$PWD:/work" -w /work ghcr.io/yannh/kubeconform:v0.6.7 -ignore-missing-schemas kubernetes
