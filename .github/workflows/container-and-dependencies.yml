name: container-and-dependencies

on:
  pull_request:

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./semantic-search/indexer
          file: ./semantic-search/indexer/Dockerfile
          push: false
          tags: semantic-observability/indexer:pr
      - uses: docker/build-push-action@v6
        with:
          context: ./semantic-search/query-api
          file: ./semantic-search/query-api/Dockerfile
          push: false
          tags: semantic-observability/query-api:pr
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
