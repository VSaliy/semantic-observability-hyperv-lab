name: codeql

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [java, python]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311  # v3.39.0
        with:
          languages: ${{ matrix.language }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        if: matrix.language == 'python'
        with:
          python-version: '3.12'
      - if: matrix.language == 'java'
        run: mvn -q -f semantic-search/query-api/pom.xml -DskipTests package
      - if: matrix.language == 'python'
        run: pip install -e semantic-search/indexer
      - uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311  # v3.39.0
