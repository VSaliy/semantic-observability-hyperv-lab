---
- name: Bootstrap the Kubernetes control plane
  hosts: control_plane
  become: true
  roles:
    - kubeadm-control-plane

- name: Join worker nodes to the cluster
  hosts: workers
  become: true
  roles:
    - kubeadm-worker

- name: Install the platform add-ons
  hosts: control_plane
  become: true
  roles:
    - platform-addons
