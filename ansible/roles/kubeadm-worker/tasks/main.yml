---
- name: Join worker nodes to the control plane
  when: kubeadm_worker_enabled | bool
  block:
    - name: Check whether this node has already joined
      ansible.builtin.stat:
        path: "{{ kubernetes_kubelet_conf }}"
      register: kubelet_conf

    - name: Resolve the join command published by the control-plane host
      ansible.builtin.set_fact:
        worker_join_command: "{{ hostvars[groups['control_plane'][0]]['kubeadm_join_command'] | default('') }}"

    - name: Fail when no join command is available
      ansible.builtin.fail:
        msg: "No kubeadm join command was published by the control-plane host."
      when:
        - not kubelet_conf.stat.exists
        - worker_join_command | length == 0
        - not ansible_check_mode

    - name: Join the cluster
      ansible.builtin.command:
        cmd: "{{ worker_join_command }}"
      register: kubeadm_join_worker
      changed_when: kubeadm_join_worker.rc == 0
      when:
        - not kubelet_conf.stat.exists
        - worker_join_command | length > 0
        - not ansible_check_mode
