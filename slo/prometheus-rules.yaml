groups:
  - name: semantic-platform-slo
    rules:
      - record: semantic:telemetry_acceptance_ratio
        expr: sum(rate(semantic_indexer_processed_events_total[5m])) / clamp_min(sum(rate(semantic_indexer_processed_events_total[5m]) + rate(semantic_indexer_dead_letter_events_total[5m])), 1)
      - alert: SemanticIndexingDelayHigh
        expr: histogram_quantile(0.99, sum(rate(semantic_indexer_processing_seconds_bucket[5m])) by (le)) > 120
        for: 10m
        labels:
          severity: warning
          runbook_url: https://grafana.example/docs/runbooks/semantic-indexing-delay
        annotations:
          summary: Semantic indexing delay breached the SLO.
      - alert: HybridSearchApiLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{uri="/api/v1/search"}[5m])) by (le)) > 2
        for: 10m
        labels:
          severity: warning
          runbook_url: https://grafana.example/docs/runbooks/hybrid-search-latency
        annotations:
          summary: Hybrid search API latency breached the SLO.
