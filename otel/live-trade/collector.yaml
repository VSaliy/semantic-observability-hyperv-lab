receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  transform/tenant:
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          - set(body["tenantId"], "trading")
exporters:
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  kafka:
    brokers: [kafka.platform-messaging:9092]
    topic: platform.telemetry-events
    encoding: raw
service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [transform/tenant]
      exporters: [otlphttp/loki, kafka]
