#cloud-config
# NoCloud user-data shared by every Kubernetes node (k8s-cp1, k8s-worker1, k8s-worker2).
# The per-node hostname is taken from the generated meta-data (local-hostname), so this
# file is intentionally hostname-agnostic and can be reused for all nodes.
#
# SECURITY: add at least one SSH public key below before provisioning.
# Password authentication is disabled by default, so an empty key list
# leaves the guest unreachable on purpose.
#
# This file only makes the node reachable and Ansible-ready. The heavy lifting
# (containerd, kubeadm prerequisites, swap, sysctl) is done idempotently by the
# Ansible roles under ansible/roles so there is a single source of truth.
manage_etc_hosts: true
preserve_hostname: false
ssh_pwauth: false

users:
  - name: labadmin
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    # Replace the empty list with your key(s), for example:
    #   - ssh-ed25519 AAAA... you@example
    ssh_authorized_keys: []

package_update: true
package_upgrade: false
packages:
  - curl
  - gnupg
  - apt-transport-https
  - ca-certificates
  - python3
  - python3-apt

write_files:
  - path: /etc/profile.d/lab-role.sh
    permissions: "0644"
    content: |
      export LAB_ROLE=kubernetes

runcmd:
  - [sh, -c, 'echo kubernetes node baseline ready > /var/tmp/k8s-node-ready.txt']
